name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUTF8: "1"
      PYTHONPATH: "src"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install validated CPU test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.12.0"
          python -m pip install "transformers==5.12.0"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile package
        run: python -m compileall -q src

      - name: Run source-tree unit and evidence tests
        run: python -m unittest discover -s tests -v

      - name: Build and audit final distributions
        run: |
          set -o pipefail
          rm -rf dist
          mkdir -p dist
          python -m build --sdist --wheel --outdir dist 2>&1 | tee dist/build.log
          test -f dist/moe_cache_lab-0.7.0-py3-none-any.whl
          test -f dist/moe_cache_lab-0.7.0.tar.gz
          if grep -Fq 'project.license' dist/build.log; then
            echo 'legacy project.license deprecation warning found in build log' >&2
            exit 1
          fi
          if grep -Fq 'License classifiers are deprecated' dist/build.log; then
            echo 'legacy license-classifier deprecation warning found in build log' >&2
            exit 1
          fi
          python scripts/audit_distributions.py \
            --version 0.7.0 \
            --wheel dist/moe_cache_lab-0.7.0-py3-none-any.whl \
            --sdist dist/moe_cache_lab-0.7.0.tar.gz

      - name: Audit lightweight offline core without ML dependencies
        run: |
          CORE_DIR="$(mktemp -d)"
          CORE_VENV="$CORE_DIR/venv"
          python -m venv "$CORE_VENV"
          (
            cd "$CORE_DIR"
            unset PYTHONPATH
            "$CORE_VENV/bin/python" -m pip install --no-deps "$GITHUB_WORKSPACE/dist/moe_cache_lab-0.7.0-py3-none-any.whl"
            "$CORE_VENV/bin/python" -c "import importlib.util, moe_cache_lab; assert importlib.util.find_spec('torch') is None; assert importlib.util.find_spec('transformers') is None; assert moe_cache_lab.__version__ == '0.7.0'"
            "$CORE_VENV/bin/python" -c "from moe_cache_lab.trace import load_trace_schema, read_trace; from moe_cache_lab.trace_v2 import load_trace_v2_schema; assert load_trace_schema()['\u0024id'] == 'urn:moe-cache-lab:schema:routing-trace:1'; assert load_trace_v2_schema()['\u0024id'] == 'urn:moe-cache-lab:schema:routing-trace:2'; assert read_trace('$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl').events"
            "$CORE_VENV/bin/moe-cache-lab" --help >/dev/null
            "$CORE_VENV/bin/moe-cache-lab" analyze "$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl" --output routing-only.md
            "$CORE_VENV/bin/moe-cache-lab" analyze "$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl" --preflight-config "$GITHUB_WORKSPACE/examples/no-download-preflight/preflight-config.json" --output preflight-report.md --json-output preflight-report.json
            sha256sum -c "$GITHUB_WORKSPACE/examples/no-download-preflight/expected.sha256"
            "$CORE_VENV/bin/python" - <<'PY'
          from pathlib import Path
          from moe_cache_lab.trace_v2 import RoutingEventV2, RoutingStageProfile, RoutingTraceV2, write_trace_v2
          write_trace_v2(
              Path("trace-v2.jsonl"),
              RoutingTraceV2(
                  model_id="synthetic/v2",
                  routing_stages=(
                      RoutingStageProfile("encoder", 4, 1, True),
                      RoutingStageProfile("decoder", 4, 1, True),
                  ),
                  events=(
                      RoutingEventV2("encoder", "source", 0, 0, "assigned", (2,), (0.75,), 10),
                      RoutingEventV2("encoder", "source", 1, 0, "unassigned", (), (), 11, "capacity"),
                      RoutingEventV2("decoder", "decoder_prompt", 0, 0, "assigned", (1,), (0.8,), 20),
                      RoutingEventV2("decoder", "decoder_generated", 1, 0, "assigned", (1,), (0.9,), 21),
                  ),
                  capture_method="synthetic-v2",
                  created_at="fixed",
                  transformers_version="5.12.0",
                  model_revision="fixed-revision",
              ),
          )
          PY
            "$CORE_VENV/bin/moe-cache-lab" analyze trace-v2.jsonl --workload-id evaluation-01 --top-k 1 --output v2-report.md --json-output v2-report.json
            if "$CORE_VENV/bin/moe-cache-lab" analyze trace-v2.jsonl --preflight-config "$GITHUB_WORKSPACE/examples/no-download-preflight/preflight-config.json" --output invalid-v2.md --json-output invalid-v2.json >v2-preflight.out 2>v2-preflight.err; then exit 1; fi
            grep -Fq 'not stage-qualified for trace v2' v2-preflight.err
            test ! -e invalid-v2.md
            test ! -e invalid-v2.json
            "$CORE_VENV/bin/moe-cache-lab" bundle-create --experiment-id no-download-preflight --config "$GITHUB_WORKSPACE/examples/no-download-preflight/preflight-config.json" --report-json preflight-report.json --report-markdown preflight-report.md --embed-trace synthetic "$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl" --output-dir no-download-preflight-bundle
            "$CORE_VENV/bin/moe-cache-lab" bundle-verify no-download-preflight-bundle
            DOC_ROOT="$CORE_VENV/share/doc/moe-cache-lab"
            test -f "$DOC_ROOT/README.md"
            test -f "$DOC_ROOT/WALKTHROUGH.md"
            test -f "$DOC_ROOT/PREFLIGHT.md"
            test -f "$DOC_ROOT/TRACE_FORMAT.md"
            test -f "$DOC_ROOT/V07_RELEASE_NOTES.md"
            "$CORE_VENV/bin/moe-cache-lab" benchmark-suite "$GITHUB_WORKSPACE/results/v0.2-corpus-v1/manifest-v1.json" --capacities 8 --output suite.md
            if "$CORE_VENV/bin/moe-cache-lab" inspect >collector.out 2>collector.err; then exit 1; fi
            grep -Fq 'moe-cache-lab[granite]' collector.err
            if grep -Fq 'Traceback' collector.err; then exit 1; fi
            if "$CORE_VENV/bin/moe-cache-lab" collect --prompt x --output trace.jsonl >collector.out 2>collector.err; then exit 1; fi
            grep -Fq 'moe-cache-lab[granite]' collector.err
            if grep -Fq 'Traceback' collector.err; then exit 1; fi
            if "$CORE_VENV/bin/moe-cache-lab" collect-corpus --output-dir corpus >collector.out 2>collector.err; then exit 1; fi
            grep -Fq 'moe-cache-lab[granite]' collector.err
            if grep -Fq 'Traceback' collector.err; then exit 1; fi
            if "$CORE_VENV/bin/moe-cache-lab" collect-stage1 --output-dir stage1 >collector.out 2>collector.err; then exit 1; fi
            grep -Fq 'moe-cache-lab[granite]' collector.err
            if grep -Fq 'Traceback' collector.err; then exit 1; fi
            if "$CORE_VENV/bin/moe-cache-lab" collect-v04 --output-root v04 >collector.out 2>collector.err; then exit 1; fi
            grep -Fq 'moe-cache-lab[granite]' collector.err
            if grep -Fq 'Traceback' collector.err; then exit 1; fi
            "$CORE_VENV/bin/python" -m pip check
          )

      - name: Audit installed final package
        run: |
          AUDIT_DIR="$(mktemp -d)"
          VENV_DIR="$AUDIT_DIR/venv"
          python -m venv --system-site-packages "$VENV_DIR"
          (
            cd "$AUDIT_DIR"
            unset PYTHONPATH
            "$VENV_DIR/bin/python" -m pip install --no-deps "$GITHUB_WORKSPACE/dist/moe_cache_lab-0.7.0-py3-none-any.whl"
            "$VENV_DIR/bin/python" -c "import moe_cache_lab; assert moe_cache_lab.__version__ == '0.7.0'; assert 'site-packages' in moe_cache_lab.__file__"
            "$VENV_DIR/bin/moe-cache-lab" --help >/dev/null
            "$VENV_DIR/bin/moe-cache-lab" analyze "$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl" --output routing-only.md
            "$VENV_DIR/bin/moe-cache-lab" analyze "$GITHUB_WORKSPACE/examples/no-download-preflight/trace.jsonl" --preflight-config "$GITHUB_WORKSPACE/examples/no-download-preflight/preflight-config.json" --output preflight-report.md --json-output preflight-report.json
            sha256sum -c "$GITHUB_WORKSPACE/examples/no-download-preflight/expected.sha256"
            "$VENV_DIR/bin/python" -m pip check
          )
