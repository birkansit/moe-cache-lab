name: E6 public export helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.ref == 'ops/e6-public-export'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out helper branch
        uses: actions/checkout@v6
        with:
          ref: ops/e6-public-export
          path: ops

      - name: Check out public release branch
        uses: actions/checkout@v6
        with:
          ref: release/v0.8.0-public
          fetch-depth: 0
          path: target

      - name: Verify exact public base
        working-directory: target
        run: test "$(git rev-parse HEAD)" = "eb7dbc2be235763b7466a5b797c08ca92243bfd9"

      - name: Download and verify exact private export artifacts
        env:
          PATCH_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d5a8-81f4-8270-a774a2988c22/raw?se=2026-08-24T10%3A10%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=f7be0928-425c-5a98-81bd-0c3eb3860911&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T06%3A13%3A07Z&ske=2026-08-25T06%3A13%3A07Z&sks=b&skv=2026-02-06&sig=YKX5d5jDcSE3udL/h42sfEpo4Gs0UOL0L0/ipN1mZUg%3D"
          SNAPSHOT_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-0164-8243-8508-9efae459b934/raw?se=2026-08-24T10%3A10%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=c8939aa3-0ec8-50b4-85bb-0c975125e348&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T08%3A18%3A53Z&ske=2026-08-25T08%3A18%3A53Z&sks=b&skv=2026-02-06&sig=VXlpXQghVbqDCjNrwaxyaLodcjehHigYpumXBlqhuig%3D"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e6/patch" "$RUNNER_TEMP/e6/snapshot"
          curl --fail --location --silent --show-error "$PATCH_URL" -o "$RUNNER_TEMP/e6/patch.zip"
          unzip -q "$RUNNER_TEMP/e6/patch.zip" -d "$RUNNER_TEMP/e6/patch"
          echo "c7b37f4fa685672e2fe4634fe2cd67856f2b60086a90ab13d1381b2ceddb902d  $RUNNER_TEMP/e6/patch/v08-public-export.patch" | sha256sum -c -
          test ! -z "$(cat "$RUNNER_TEMP/e6/patch/v08-public-export.paths")"
          test "$(wc -l < "$RUNNER_TEMP/e6/patch/v08-public-export.paths")" -eq 83
          ! grep -Fxq 'README.md' "$RUNNER_TEMP/e6/patch/v08-public-export.paths"
          curl --fail --location --silent --show-error "$SNAPSHOT_URL" -o "$RUNNER_TEMP/e6/snapshot.zip"
          unzip -q "$RUNNER_TEMP/e6/snapshot.zip" -d "$RUNNER_TEMP/e6/snapshot"
          echo "bf4e2b8a43aa66b6b138f2b21f54bb042f567eda6742a8d116028c529e677194  $RUNNER_TEMP/e6/snapshot/moe-cache-lab-private-main.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/e6/private"
          tar -xzf "$RUNNER_TEMP/e6/snapshot/moe-cache-lab-private-main.tar.gz" -C "$RUNNER_TEMP/e6/private"
          test -f "$RUNNER_TEMP/e6/private/README.md"
          grep -Fq 'Current package version: **0.8.0**' "$RUNNER_TEMP/e6/private/README.md"

      - name: Apply exact non-README v0.8 delta
        working-directory: target
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/e6/patch/v08-public-export.patch"
          git apply "$RUNNER_TEMP/e6/patch/v08-public-export.patch"

      - name: Reconcile public README with accepted v0.8 contract
        working-directory: target
        run: |
          cat > README.md <<'EOF'
          # moe-cache-lab

          **Trace-driven pre-flight analysis for MoE routing, expert caching, and offloading research.**

          `moe-cache-lab` is a correctness-first, **trace-driven MoE pre-flight analysis toolkit**
          and offline research tool that sits between **routing observation** and **runtime
          offloading engineering**. Give it a canonical MoE routing trace and it can
          describe routing evidence, replay compatible traces through explicit byte-cache
          simulations, estimate serialized transfer service under caller-supplied
          assumptions, and package artifacts for reproducibility.

          It is designed to answer a bounded question before deeper runtime work:

          > **What does the observed routing trace establish about locality and simulated
          > cache behavior, and what does it still leave unmeasured?**

          Current package version: **0.8.0**. Historical v0.2/v0.3/v0.4 evidence remains
          preserved with its original interpretation and hashes.

          | | |
          | --- | --- |
          | **Input** | A canonical, versioned MoE routing trace from a supported collector or another conforming producer |
          | **Output** | Routing evidence, compatible byte-cache simulations, transfer-sensitivity estimates, and deterministic reports/bundles |
          | **Base install** | Python 3.10+; offline trace validation and analysis do not require PyTorch or Transformers |
          | **Current release** | `0.8.0` |

          ```text
          model / runtime / producer
                    |
                    v
          canonical routing trace
                    |
                    v
          strict read + validation
                    |
                    v
             routing analysis
                    |
                    +----------------------+
                    |                      |
                    v                      v
          compatible pre-flight       reproducibility
          cache / transfer model          bundle
          ```

          The canonical JSONL trace is the interoperability boundary. Invalid chronology
          is rejected rather than sorted or repaired, and encoder/decoder identity is not
          flattened. Routing-trace and pre-flight-config version numbers are independent;
          the supported combinations are defined in [`COMPATIBILITY.md`](COMPATIBILITY.md).
          External producer validity, semantic mapping, and non-interference are separate
          claims governed by [`PRODUCER_CONFORMANCE.md`](PRODUCER_CONFORMANCE.md).

          The base installation validates, imports, and analyzes canonical v1/v2 traces
          without PyTorch or Transformers. Model collection is optional and model-specific.
          The built-in public collector remains Granite/Transformers-specific.

          > **This project is not an inference accelerator.** It does not implement expert
          > swapping/offloading or physical GPU residency management. It observes and
          > analyzes routing, simulates cache behavior, and estimates a simple serialized
          > transfer-service cost under explicit assumptions.

          ## One bounded result, shown without a performance claim

          A tracked V0.7 observational smoke used the pinned
          `google/switch-base-8` revision
          `92fe2d22b024d9937146fe097ba3d3a7ba146e1b` on CPU. Native post-capacity routing
          was observed without modifying routing decisions. One version-aware LRU replay
          then applied an eight-expert byte capacity to that trace.

          | Quantity | Result | Evidence class |
          | --- | ---: | --- |
          | Routing events | 156 assigned / 0 unassigned | **MEASURED routing observation** |
          | Stage-qualified expert objects | 96 | model/trace structure |
          | Parameter payload per expert | 18,874,368 bytes | parameter payload accounting; **not physical residency** |
          | LRU cache capacity | 150,994,944 bytes | caller-selected simulation input |
          | Cache hits / misses | 89 / 67 | **SIMULATED** |
          | Evictions | 59 | **SIMULATED** |
          | Demand-load bytes | 1,264,582,656 | **SIMULATED cache-model accounting** |
          | Peak/final resident bytes | 150,994,944 | **SIMULATED cache-model accounting** |

          This example demonstrates that one real stage-qualified Switch routing trace can
          enter the portable offline cache model without encoder/decoder aliasing. It does
          **not** establish physical GPU residency, real H2D traffic, end-to-end latency,
          throughput, tokens/sec, speedup, policy optimality, or workload
          representativeness. See [`V07_SWITCH_SMOKE.md`](V07_SWITCH_SMOKE.md) for the full
          provenance and limitations.

          EOF
          sed -i 's/^          //' README.md
          awk 'BEGIN{emit=0} /^## Canonical current-use path$/{emit=1} emit{print}' "$RUNNER_TEMP/e6/private/README.md" >> README.md

      - name: Validate final public release tree
        working-directory: target
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          test "$(python -c 'import moe_cache_lab; print(moe_cache_lab.__version__)')" = "0.8.0"
          git add -A
          { cat "$RUNNER_TEMP/e6/patch/v08-public-export.paths"; echo README.md; } | sort > "$RUNNER_TEMP/e6/expected-paths"
          git diff --cached --name-only HEAD | sort > "$RUNNER_TEMP/e6/actual-paths"
          diff -u "$RUNNER_TEMP/e6/expected-paths" "$RUNNER_TEMP/e6/actual-paths"
          test "$(wc -l < "$RUNNER_TEMP/e6/actual-paths")" -eq 84
          test -z "$(git diff --cached --name-only HEAD -- results)"
          git diff --cached --check
          python -m unittest tests.test_release_surface_hygiene tests.test_v08_release_hardening tests.test_external_runtime_interop_policy -v
          python scripts/audit_publication_hygiene.py
          python -m compileall -q src tests scripts examples

      - name: Commit exact public release candidate
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "DutchVanDerLinde1710"
          git config user.email "85397651+birkansit@users.noreply.github.com"
          git commit -m "Release v0.8.0"
          test "$(git rev-list --count eb7dbc2be235763b7466a5b797c08ca92243bfd9..HEAD)" -eq 1
          git push origin HEAD:release/v0.8.0-public
