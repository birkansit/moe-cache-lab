name: Verify release and clean publication refs

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'release/v0.8.0-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTED_SHA: e9fb09ec2bc3c39369958cd9aa9ecdc1f5c8cf25
    steps:
      - name: Check out accepted public source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify published v0.8.0
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          git fetch --tags origin
          test "$(git rev-list -n 1 v0.8.0)" = "$ACCEPTED_SHA"
          gh release view v0.8.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease --jq 'select(.tagName == "v0.8.0" and .isDraft == false and .isPrerelease == false)' >/dev/null

      - name: Remove temporary publication branches
        run: |
          set -euo pipefail
          for ref in ops/e6-public-export release/v0.8.0-public release/v0.8.0-publish; do
            if git ls-remote --exit-code --heads origin "refs/heads/$ref" >/dev/null 2>&1; then
              git push origin --delete "$ref"
            fi
          done
