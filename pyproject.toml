[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-cache-lab"
version = "0.5.0"
description = "Trace-driven MoE pre-flight analysis for expert caching/offloading research."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "torch==2.12.0",
  "transformers==5.12.0",
]

[project.scripts]
moe-cache-lab = "moe_cache_lab.cli:main"

[project.urls]
Repository = "https://github.com/birkansit/moe-cache-lab"
Issues = "https://github.com/birkansit/moe-cache-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
